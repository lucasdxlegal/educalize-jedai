<section class="section">

  <div class="container">

    <h2 class="title">
      O que dizem nossos clientes
    </h2>

    <div class="testimonial-slider">

      <div class="slides">

        <img src="./3-1.PNG" class="slide active">
        <img src="./3-2.PNG" class="slide">
        <img src="./3-3.PNG" class="slide">

      </div>

      <div class="slider-buttons">

        <button onclick="prevSlide()">❮</button>
        <button onclick="nextSlide()">❯</button>

      </div>

      <div class="slider-dots">

        <span class="dot active-dot" onclick="goToSlide(0)"></span>
        <span class="dot" onclick="goToSlide(1)"></span>
        <span class="dot" onclick="goToSlide(2)"></span>

      </div>

    </div>

  </div>

</section>

<style>

.testimonial-slider{
  position:relative;
  width:100%;
  max-width:1000px;
  margin:auto;
}

.slides{
  position:relative;
  overflow:hidden;
  border-radius:24px;
}

.slide{
  width:100%;
  display:none;
  border-radius:24px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.slide.active{
  display:block;
  animation:fade .4s ease;
}

@keyframes fade{
  from{
    opacity:.4;
    transform:scale(.98);
  }

  to{
    opacity:1;
    transform:scale(1);
  }
}

.slider-buttons{
  position:absolute;
  top:50%;
  left:0;
  width:100%;
  transform:translateY(-50%);
  display:flex;
  justify-content:space-between;
  padding:0 12px;
  pointer-events:none;
}

.slider-buttons button{
  width:52px;
  height:52px;
  border:none;
  border-radius:50%;
  background:#4b1fb1;
  color:#fff;
  font-size:24px;
  cursor:pointer;
  pointer-events:all;
  box-shadow:0 6px 20px rgba(0,0,0,.15);
}

.slider-dots{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:20px;
}

.dot{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#ccc;
  cursor:pointer;
  transition:.3s;
}

.active-dot{
  background:#4b1fb1;
  transform:scale(1.2);
}

@media(max-width:768px){

  .slider-buttons button{
    width:42px;
    height:42px;
    font-size:20px;
  }

}

</style>

<script>

let currentSlide = 0;

const slides = document.querySelectorAll('.slide');
const dots = document.querySelectorAll('.dot');

function showSlide(index){

  slides.forEach(slide => {
    slide.classList.remove('active');
  });

  dots.forEach(dot => {
    dot.classList.remove('active-dot');
  });

  slides[index].classList.add('active');
  dots[index].classList.add('active-dot');

}

function nextSlide(){

  currentSlide++;

  if(currentSlide >= slides.length){
    currentSlide = 0;
  }

  showSlide(currentSlide);

}

function prevSlide(){

  currentSlide--;

  if(currentSlide < 0){
    currentSlide = slides.length - 1;
  }

  showSlide(currentSlide);

}

function goToSlide(index){

  currentSlide = index;
  showSlide(currentSlide);

}

setInterval(() => {
  nextSlide();
}, 4000);

</script>
